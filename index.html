<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNTDOWN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h2>COUNTDOWN</h2>
        <div class="time">
            <div class="h">00</div>
            <div>:</div>
            <div class="m">00</div>
            <div>:</div>
            <div class="s">00</div>
        </div>
        <div class="btn">
            <button class="stop">STOP</button>
            <button class="strt">START</button>
            <button class="rest">RESET</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
